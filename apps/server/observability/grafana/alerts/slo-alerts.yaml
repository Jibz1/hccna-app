apiVersion: 1
groups:
  - name: hccna-backend-slo
    interval: 1m
    rules:
      - uid: hccna-api-availability-page
        title: API availability below 99.9%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * (1 - ((sum by (job) (rate(http_server_errors_total[5m])) / (sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0)) or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[5m]))))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A < 99.9
              type: math
        for: 5m
        annotations:
          summary: API availability dropped below objective
        labels:
          severity: page

      - uid: hccna-api-error-rate-warn
        title: API error rate above 1%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * ((sum by (job) (rate(http_server_errors_total[5m])) / (sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0)) or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A > 1
              type: math
        for: 5m
        annotations:
          summary: Error rate above warning threshold
        labels:
          severity: warn

      - uid: hccna-api-error-rate-page
        title: API error rate above 3%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * ((sum by (job) (rate(http_server_errors_total[5m])) / (sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0)) or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A > 3
              type: math
        for: 5m
        annotations:
          summary: Error rate above paging threshold
        labels:
          severity: page

      - uid: hccna-graphql-latency-page
        title: GraphQL p95 latency above 800ms
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le, job) (rate(http_server_request_duration_seconds_bucket{path_group="/graphql"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A > 0.8
              type: math
        for: 5m
        annotations:
          summary: GraphQL p95 latency exceeded 800ms
        labels:
          severity: page

      - uid: hccna-rest-latency-warn
        title: REST p95 latency above 500ms
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le, job) (rate(http_server_request_duration_seconds_bucket{path_group!="/graphql"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A > 0.5
              type: math
        for: 5m
        annotations:
          summary: REST p95 latency exceeded 500ms
        labels:
          severity: warn

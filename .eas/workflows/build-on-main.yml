# Optional automation: preview builds when mobile-relevant paths change on main.
# The manual `eas build` flow from apps/mobile remains the primary release path.
name: build-on-main
on:
  push:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - "packages/schema/**"
      - "packages/config/**"
jobs:
  build_ios_preview:
    name: Build iOS (preview)
    type: build
    params:
      platform: ios
      profile: preview
  build_android_preview:
    name: Build Android (preview)
    type: build
    params:
      platform: android
      profile: preview

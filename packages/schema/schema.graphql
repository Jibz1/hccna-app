type Mutation {
  """Update CMS data from Strapi Webhook"""
  cmsWebhookUpdate(
    """Strapi webhook payload"""
    input: StrapiWebHookUpdateInput!
  ): StrapiWebHookUpdateResult
  createEmailLink(
    """User email"""
    email: String!
  ): CreateEmailLinkResult
  createEventAttendance(
    """Event attendance input"""
    input: UpdateEventAttendanceInput!
  ): UpdateEventAttendanceResult
  createSignInCode(
    """User email"""
    email: String!
  ): CreateSignInOrDeleteAccountCodeResult

  """
  Idempotently provisions and reconciles the caller's user profile from their verified Firebase identity. Safe to call on every sign-in.
  """
  ensureUserProfile: EnsureUserProfileResult
  exportEventAttendancePdf(format: AttendanceExportFormat = PDF, input: [EventAttendanceExportEventInput!]!, occurrenceDate: String!): AttendancePdfExportResult
  exportEventAttendeesPdf(eventId: String!, format: AttendanceExportFormat = PDF, occurrenceDate: String!): AttendancePdfExportResult

  """
  Add verses saved on a device to the caller's account. Existing saves are kept, so retries are safe.
  """
  importSavedVerses(verses: [SavedVerseImportInput!]!): ImportSavedVersesPayload!

  """
  Cleans up Firestore user data after Auth account deletion. Called by internal systems after a user account is removed from Firebase Auth.
  """
  postDeletionCleanup(
    """User email"""
    email: String!

    """User UID"""
    uid: String!
  ): UpdateUserProfile

  """
  Retry a bounded batch of pending campus subscription changes. Called by Cloud Scheduler.
  """
  reconcileCampusSubscriptions: CampusSubscriptionSyncResult

  """
  Replay-safe, idempotent push-token upsert keyed by the FCM token. Repeating the same input for the same authenticated user converges to one registration and the same topic set without duplicate registrations or topic memberships. followPreferredCampus replays reconcile the latest backend preference, which may change between requests.
  """
  registerPushToken(
    """The push token registration input"""
    input: RegisterPushTokenInput!
  ): RegisterPushTokenResult

  """Remove a saved scripture from the caller's account"""
  removeSavedVerse(verseId: ID!): RemoveSavedVersePayload!

  """Request to delete account"""
  requestDeleteAccount: CreateSignInOrDeleteAccountCodeResult

  """
  Save a scripture to the caller's account. Saving an already saved verse returns the existing save.
  """
  saveVerse(kind: SavedVerseKind!, verseId: ID!): SavedVerse!
  sendAnnouncement(
    """The input to send the announcement to"""
    input: SendAnnouncementInput!
  ): SendAnnouncementResult
  sendBroadcast(
    """The input to send the broadcast to"""
    input: SendBroadcastInput!
  ): SendBroadcast

  """
  Save the caller's campus with optimistic concurrency. A false success returns the newer canonical preference. Firestore profile and subscription synchronization may remain pending after the preference is saved.
  """
  setPreferredCampus(campusSlug: String!, expectedVersion: Int!): CampusPreferenceResult

  """Set the daily Bible verse"""
  setVerseOfTheDay: SetVerseOfTheDayResultV2

  """
  Retire one device registration using its logout key. May be retried with anonymous Firebase auth after logout. A newer registration is unaffected. Returns false when cleanup could not complete; retry later.
  """
  unregisterPushToken(
    """
    Previous owner for a registration made before logout keys existed. Ignored for keyed registrations.
    """
    legacyUserId: String
    logoutKey: String!
    token: String!
  ): Boolean!
  updateCastrStream(input: UpdateCastrStreamInput!): PingCastrStreamResponse
  updateUserProfile(
    """User profile update data"""
    input: UpdateUserProfileInput!
  ): UpdateUserProfile

  """Verify delete account code"""
  verifyDeleteAccountCode(
    """Delete account code"""
    code: String!
  ): UpdateUserProfile
  verifySignInCode(
    """Sign in code"""
    code: String!

    """User email"""
    email: String!
  ): VerifySignInCodeResult

  """
  Send a push notification for the daily Bible verse with typed error handling
  """
  vodPushNotification: VodPushNotificationResult

  """
  Start assigning this month's Word of Activation and emailing and pushing monthly subscribers
  """
  wordOfActivationMonthly: WordOfActivationMonthlyResult

  """
  Start sending this month's still-pending Word of Activation emails and pushes without assigning verses
  """
  wordOfActivationSendPending: WordOfActivationRunStarted
}


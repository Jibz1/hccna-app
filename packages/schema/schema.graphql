"""Word of Activation for the current month"""
type WordOfActivation {
  """The book name of the Bible verse"""
  book: String

  """The email of the user"""
  email: String

  """Optional image associated with the verse"""
  image: String

  """The month for this verse"""
  month: String

  """The monthly subscription status"""
  monthlySub: Boolean

  """The name of the user"""
  name: String

  """Short book name or reference"""
  stBook: String

  """The actual verse text"""
  text: String

  """Unique identifier for the verse"""
  verseId: String
}

union WordOfActivationMonthlyResult = WordOfActivationMonthlySuccess | WordOfActivationRotationError | WordOfActivationRunStarted

"""No longer returned; runs now report WordOfActivationRunStarted."""
type WordOfActivationMonthlySuccess {
  """Subscriptions assigned a new verse this run"""
  assigned: Int

  """Monthly emails sent this run"""
  emailed: Int

  """Subscriptions that failed to process; see logs"""
  failed: Int

  """Success message"""
  message: String

  """Subscribers with at least one device accepting a monthly push this run"""
  notified: Int

  """Subscriptions already rotated this month"""
  skipped: Int
}

"""No longer returned; run failures are reported to Sentry."""
type WordOfActivationRotationError {
  """Error message when the monthly rotation fails"""
  message: String
}

"""
A Word of Activation delivery run started in the background. Outcomes go to logs and Sentry.
"""
type WordOfActivationRunStarted {
  """Which run started"""
  message: String
}
      - any-glob-to-any-file: "packages/**"

schema:
  - changed-files:
      - any-glob-to-any-file: "packages/schema/**"

castr:
  - changed-files:
      - any-glob-to-any-file: "packages/castr/**"

ccb:
  - changed-files:
      - any-glob-to-any-file: "packages/ccb/**"


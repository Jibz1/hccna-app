name: deploy mobile update
run-name: Mobile OTA (${{ inputs.platform }}) — ${{ inputs.check_only && 'check only' || inputs.message }}

on:
  workflow_dispatch:
    inputs:
      message:
        description: Release message for EAS Update (not needed for check only)
        required: false
        type: string
      platform:
        description: Platforms to update
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      check_only:
        description: Only show the next OTA version and check EAS; publish nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Check-only runs get their own group so they never cancel a queued publish.
  group: mobile-update-production${{ inputs.check_only && '-check' || '' }}
  cancel-in-progress: false

jobs:
  publish:
    # Production updates come from reviewed commits on the default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-production
    steps:
      - name: Require a release message
        if: ${{ !inputs.check_only }}
        shell: bash
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          [ -n "${UPDATE_MESSAGE//[[:space:]]/}" ] || { echo "::error::Enter a release message, or choose check only."; exit 1; }

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check mobile and its dependencies
        run: bunx turbo run build typecheck lint fmt:check test --filter=@hccnj/mobile...
        env:
          NODE_ENV: test
          # Reuse the remote cache that checks.yml filled for this commit.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Restore Firebase configuration
        working-directory: apps/mobile
        # Base64 keeps the files byte-exact; they are fingerprint inputs.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.MOBILE_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "::error::Missing MOBILE_GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          test -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" || { echo "::error::Missing MOBILE_GOOGLE_SERVICE_INFO_PLIST_BASE64"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist

      - name: Install EAS CLI
        run: npm install --global eas-cli@24.12.0

      - name: Publish or check the OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          UPDATE_MESSAGE: ${{ inputs.message }}
          UPDATE_PLATFORM: ${{ inputs.platform }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN"; exit 1; }
          if [ "$CHECK_ONLY" = "true" ]; then
            bun run update:publish -- --check --platform "$UPDATE_PLATFORM"
            exit 0
          fi
          test -n "$SENTRY_AUTH_TOKEN" || { echo "::error::Missing SENTRY_AUTH_TOKEN"; exit 1; }
          bun run update:publish -- --message "$UPDATE_MESSAGE" --platform "$UPDATE_PLATFORM" --non-interactive

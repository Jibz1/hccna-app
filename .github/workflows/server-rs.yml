# Checks the experimental Rust backend in apps/server-rs and builds its Docker image.
# Nothing is pushed or deployed.
# Design: docs/superpowers/specs/2026-10-13-server-rust-benchmark-design.md.
name: server-rs

on:
  push:
    branches: [main]
    # Changes to the Rust app or this workflow.
    paths:
      - "apps/server-rs/**"
      - ".github/workflows/server-rs.yml"
  pull_request:
    # PRs also check the shared contracts the crate reads.
    paths:
      - "apps/server-rs/**"
      - "packages/schema/schema.graphql"
      - "packages/strapi-v2/**"
      - ".github/workflows/server-rs.yml"

permissions:
  contents: read

concurrency:
  group: server-rs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server-rs
    # A throwaway Postgres for the tests that read TEST_DATABASE_URL (they skip without it).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ada
          POSTGRES_PASSWORD: example-password
          POSTGRES_DB: example
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ada -d example"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://ada:example-password@localhost:5432/example
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/server-rs

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server-rs/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=server-rs-image
          cache-to: type=gha,scope=server-rs-image,mode=max

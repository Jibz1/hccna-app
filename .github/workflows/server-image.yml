# Builds the apps/server Docker image to check that it still builds. Nothing is pushed
# or deployed.
name: server image

on:
  push:
    branches: [main]
    # Files the server image depends on.
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".dockerignore"
      - "apps/mobile/package.json"
      - "patches/**"
      - "scripts/sync-effect-repo.mjs"
      - ".github/workflows/server-image.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".dockerignore"
      - "apps/mobile/package.json"
      - "patches/**"
      - "scripts/sync-effect-repo.mjs"
      - ".github/workflows/server-image.yml"

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max

# Builds apps/server and deploys it to Railway (production). Pull requests
# only build the image. Database migrations never run here; the owner runs
# the "Drizzle Migrations CI" workflow manually.
name: deploy server

on:
  push:
    branches: [main]
    # Files the server image depends on. apps/mobile/package.json and patches/
    # are PR-only: the Dockerfile copies them, but their changes are mobile-side
    # and should not redeploy the server.
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".dockerignore"
      - "scripts/sync-effect-repo.mjs"
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".dockerignore"
      - "apps/mobile/package.json"
      - "patches/**"
      - "scripts/sync-effect-repo.mjs"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RAILWAY_CLI_VERSION: "5.63.1"
  RAILWAY_ENVIRONMENT: production
  RAILWAY_SERVICE: hccna-backend
  # Fixed so the health check needs no Railway API call (and never loads the
  # service's secret variables). Update it if the service domain changes.
  RAILWAY_HEALTH_URL: https://hccna-backend-production.up.railway.app/readyz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max

  deploy-railway:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DATABASE_URL
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DEPLOY_MESSAGE: ${{ github.sha }} (run ${{ github.run_id }})
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      # Uploads the monorepo root; the service builds apps/server/Dockerfile.
      - name: Deploy to Railway
        run: |
          railway up --ci \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --message "$DEPLOY_MESSAGE"

      # `railway up --ci` returns after the build; wait for the deployment to
      # pass its /readyz healthcheck and become active.
      - name: Wait for deployment
        run: |
          for attempt in $(seq 1 60); do
            status=$(railway deployment list --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --json --limit 10 |
              jq -r --arg message "$DEPLOY_MESSAGE" '[.[] | select(.meta.cliMessage == $message)][0].status // "PENDING"')
            case "$status" in
              SUCCESS) echo "Railway deployment is active"; exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED) echo "::error::Railway deployment ended as $status"; exit 1 ;;
            esac
            echo "deployment status (check $attempt): $status"
            sleep 10
          done
          echo "::error::Railway deployment did not become active in time"
          exit 1

      - name: Health check
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 5 --retry-all-errors --retry-delay 5 "$RAILWAY_HEALTH_URL"
          echo
          echo "Railway is ready ($RAILWAY_HEALTH_URL)"

# PRs check the proposed contract against production for backward compatibility.
# Scheduled/manual runs check whether the selected app can use production now.
name: schema drift

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
  pull_request:
    paths:
      - "packages/schema/**"
      - "apps/mobile/src/**/__generated__/*.graphql.ts"
      - "apps/mobile/src/utils/schemaContract.test.ts"
      - "apps/mobile/scripts/download-deployed-schema*"
      - "apps/server/src/graphql/emit.ts"
      - "apps/mobile/vitest.config.mts"
      - ".github/workflows/schema-drift.yml"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install deps
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Validate proposed mobile operations against proposed schema
        if: github.event_name == 'pull_request'
        run: bunx vitest run src/utils/schemaContract.test.ts

      - name: Reject changes that break the deployed API
        if: github.event_name == 'pull_request'
        run: bun run ./scripts/download-deployed-schema.ts --check-compatibility

      - name: Download production schema for release readiness
        if: github.event_name != 'pull_request'
        run: bun run schema:drift:pull

      - name: Validate selected mobile operations against production
        if: github.event_name != 'pull_request'
        run: bunx vitest run src/utils/schemaContract.test.ts
